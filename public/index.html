<!DOCTYPE html>
<html lang="en">

<head >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post Saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-blue-600">LinkedIn Post Saver</h1>

        <div class="flex justify-between items-center mb-6">
            <div id="viewToggles" style="display:none;" class="flex gap-2">
                <button id="myPostsTab" type="button" onclick="loadUserPosts()"
                    class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold">My Saved Posts</button>
                <button id="publicPostsTab" type="button" onclick="loadPublicPosts()"
                    class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">Public Gallery</button>
            </div>

            <div id="authSection">
                <button id="signInBtn" type="button" onclick="loginWithGoogle()"
                    class="bg-blue-600 text-white px-4 py-2 rounded shadow">Sign in with Google</button>
                <div id="userProfile" style="display:none;" class="items-center gap-3">
                    <img id="dynamicLogo" alt="Google profile picture"
                        class="w-10 h-10 rounded-full border-2 border-blue-500">
                    <span id="welcomeText" class="font-bold text-gray-700"></span>
                    <button type="button" onclick="signOut()" class="text-sm text-red-500 hover:underline">Log Out</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow mb-8 flex gap-4">
            <input type="url" id="linkInput" placeholder="Paste LinkedIn post URL here..."
                class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">


            <button onclick="savePost(document.getElementById('groupSelect').value)"
                class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition" id="saveButton" disabled>
                Save
            </button>
        </div>
        <div id="loginModal" style="display:none;" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
  <div class="bg-white p-6 rounded shadow-lg text-center">
    <h2 id="modalText" class="text-xl font-bold mb-4">Sign in to continue!</h2>
    <button type="button" onclick="loginWithGoogle()" class="bg-blue-600 text-white px-4 py-2 rounded">Sign in with Google</button>
  </div>
</div>
        <button onclick="toggleReminderFilter()"
            class="bg-yellow-500 text-black px-10 py-1 rounded hover:bg-yellow-600 transition">
            FAV
        </button>
        <select id="groupSelect" onchange="currentGroup = this.value; renderAll();" class="border p-2 rounded bg-white">
            <option value="All">All Groups</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
        </select>
        </button>
        <div id="postsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        </div>
    </div>
    <!-- history feature FRICK NEW -->
    <div class="flex gap-8">
        <div class="flex-1">
        </div>

        <aside class="w-64">
            <h2 class="font-bold mb-4">Post History</h2>
            <ul id="historyContainer"></ul>
        </aside>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>

</html>
